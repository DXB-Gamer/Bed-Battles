<style>

<div id="tips"></div></div></div>
<script>
const T=32,W=48,H=36,COL=['#e5484d','#3e7bfa','#3fb950','#f2c230'],NM=['Red','Blue','Green','Yellow'],B=[[8,7],[39,7],[39,28],[8,28]];
const SWN=['Wood','Stone','Iron','Diamond'],ARN=['None','Chain','Iron','Diamond'],RC={iron:'#cfd3da',gold:'#ffcc33',dia:'#4de3ff',em:'#3be07a'},RN={iron:'Iron',gold:'Gold',dia:'Diamond',em:'Emerald'};
const EV=[[120,'Diamond II'],[240,'Emerald II'],[360,'Diamond III'],[480,'Emerald III'],[600,'Bed Gone'],[780,'Sudden Death']];
let g,own,teams,pl,me,wg,time=0,over=null,run=false,keys={},mx=0,my=0,md=false,tool=0,cam={x:0,y:0},logs=[],Z=1,ot=0,lastShop='',fc=0;
const $=i=>document.getElementById(i),cv=$('c');
const I=(x,y)=>x<0||y<0||x>=W||y>=H?-1:y*W+x,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),tileAt=(x,y)=>{const i=I(Math.floor(x/T),Math.floor(y/T));return i<0?0:g[i]},lbl=p=>p.hum?'You':p.t.nm+' '+p.k;
const log=s=>logs.push({s,t:time});
let bty,bh,pj=[],tnts=[],drs=[],efx=[],parts=[],shake=0,aim={},shopOpen=0,shopTab=0,flash=null,cdn=0,hurtFx=0,pops=[],ST={w:0,k:0,b:0,g:0},lastN=-1,hsig='',lgsig='',mAct=false;const X=cv.getContext('2d');
function rsz(){cv.width=innerWidth;cv.height=innerHeight;Z=Math.max(.6,Math.min(1.1,innerWidth/1100))}onresize=rsz;rsz();
function isl(a,b,r){for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(Math.hypot(x-a,y-b)<=r)g[I(x,y)]=1}
const BH=[2,6,8,24],BC=[null,'#b08a55','#e6e3a6','#2a1747'],BN=['Wool','Wood','End Stone','Obsidian'],TL=['Sword','Blocks','TNT','Fireball','Pearl'];
const blk=(n,i,r,a,c)=>({n,c:[r,c],f:p=>p.inv.bl[i]+=a});
const SH=[blk('Wool ×16',0,'iron',16,4),blk('Wood ×16',1,'gold',16,4),blk('End Stone ×12',2,'iron',12,24),blk('Obsidian ×4',3,'em',4,4),
{n:'Stone Sword',c:['iron',10],f:p=>p.sw=Math.max(p.sw,1),ok:p=>p.sw<1},
{n:'Iron Sword',c:['gold',7],f:p=>p.sw=Math.max(p.sw,2),ok:p=>p.sw<2},
{n:'Diamond Sword',c:['em',4],f:p=>p.sw=3,ok:p=>p.sw<3},
{n:'Chain Armor',c:['iron',40],f:p=>p.ar=1,ok:p=>p.ar<1},
{n:'Iron Armor',c:['gold',12],f:p=>p.ar=2,ok:p=>p.ar<2},
{n:'Diamond Armor',c:['em',6],f:p=>p.ar=3,ok:p=>p.ar<3},
{n:'Iron Pickaxe',c:['iron',10],f:p=>p.pk=1,ok:p=>p.pk<1},
{n:'Gold Pickaxe',c:['gold',3],f:p=>p.pk=2,ok:p=>p.pk<2},
{n:'Diamond Pickaxe',c:['gold',6],f:p=>p.pk=3,ok:p=>p.pk<3},
{n:'Golden Apple',c:['gold',3],f:p=>p.hp=Math.min(20,p.hp+10),ok:p=>p.hp<20},
{n:'TNT',c:['gold',4],f:p=>p.inv.tnt++},{n:'Fireball',c:['iron',40],f:p=>p.inv.fb++},{n:'Ender Pearl',c:['em',4],f:p=>p.inv.pr++}];
const UP=[{n:'Forge',k:'forge',cs:[2,4,6,8]},{n:'Sharpened Swords',k:'sharp',cs:[4]},{n:'Reinforced Armor',k:'prot',cs:[2,4,8,16]},{n:'Heal Pool',k:'heal',cs:[3]},{n:'Trap (slows intruders)',k:'trap',cs:[2]}];
function buy(p,it){if(it.ok&&!it.ok(p))return false;if(p.inv[it.c[0]]<it.c[1])return false;p.inv[it.c[0]]-=it.c[1];it.f(p);return true}
function upCost(t,u){return u.cs[t[u.k]]}
function buyUp(p,u){const k=upCost(p.t,u);if(k==null||p.inv.dia<k)return false;p.inv.dia-=k;p.t[u.k]++;if(p.hum)log('Team upgrade: '+u.n);return true}
function start(m){
 g=new Uint8Array(W*H);own=new Uint8Array(W*H);bty=new Uint8Array(W*H);bh=new Float32Array(W*H);teams=[];pl=[];time=0;over=null;logs=[];keys={};tool=0;ot=0;
 const ids=m=='f'||m=='q'?[0,1,2,3]:[0,2],per=m=='4'||m=='q'?4:1;
 ids.forEach(i=>isl(B[i][0],B[i][1],6.3));isl(24,17,4.3);isl(24,5,2.7);isl(24,30,2.7);
 const P=(a,b)=>({x:(a+.5)*T,y:(b+.5)*T}),mk=(a,b,k)=>({...P(a,b),k,s:{[k]:0},c:{[k]:0}});
 wg=[mk(24,5,'dia'),mk(24,30,'dia'),mk(24,17,'em')];
 ids.forEach(id=>{const b=B[id],dx=Math.sign(24-b[0]),dy=Math.sign(17-b[1]);
  const t={id,col:COL[id],nm:NM[id],bed:{tx:b[0]-3*dx,ty:b[1],alive:true},gen:{...P(b[0],b[1]-3*dy),s:{iron:0,gold:0,em:0},c:{iron:0,gold:0,em:0}},shop:P(b[0]+3*dx,b[1]),upg:P(b[0],b[1]+3*dy),forge:0,sharp:0,prot:0,heal:0,trap:0,alive:true,sp:P(b[0],b[1])};
  teams.push(t);
  
  for(let k=0;k<per;k++){const o=[[0,0],[1,1],[-1,1],[1,-1]][k];
   pl.push({t,k:k+1,hum:!pl.length,x:t.sp.x+o[0]*T,y:t.sp.y+o[1]*T,hp:20,alive:true,out:false,rs:0,cd:0,fl:0,fall:0,kx:0,ky:0,ang:0,pt:0,lh:null,slow:0,sel:0,pk:0,inv:{iron:0,gold:0,dia:0,em:0,bl:[24,0,0,0],tnt:0,fb:0,pr:0},sw:0,ar:0,
   ai:{st:-1,until:0,g:null,base:null,bt:0,bk:0,path:null,pt:0,th:Math.random()*.4}})}
 });
 me=pl[0];parts=[];pj=[];tnts=[];drs=[];efx=[];shake=0;run=true;startFx();
}
function tick(o,k,iv,dt,cap){o.c[k]+=dt;if(o.c[k]>=iv){o.c[k]=0;if(o.s[k]<cap)o.s[k]++}}
function setTile(x,y,v,id,ty=0){const i=I(Math.floor(x/T),Math.floor(y/T));if(i<0)return;g[i]=v;own[i]=id+1;bty[i]=ty;bh[i]=BH[ty]}
function blocked(x,y){return[[-6,-6],[6,-6],[-6,6],[6,6]].some(o=>tileAt(x+o[0],y+o[1])==2)}
function move(p,vx,vy,dt){const nx=p.x+(vx+p.kx)*dt,ny=p.y+(vy+p.ky)*dt;if(!blocked(nx,p.y))p.x=nx;else p.kx=0;if(!blocked(p.x,ny))p.y=ny;else p.ky=0;const d=Math.max(0,1-dt*8);p.kx*=d;p.ky*=d}
function destroyBed(t,by){if(by&&time<20)return;t.bed.alive=false;log(t.nm+' bed was destroyed'+(by?' by '+lbl(by):'')+'!');snd('bed');shake=Math.max(shake,12);if(t==me.t)banner('YOUR BED WAS DESTROYED!','#ff5a5a','You will not respawn');else if(by&&by.hum){ST.b++;banner('BED DESTROYED!','#ffd23f',t.nm+' team')}else banner(t.nm.toUpperCase()+' BED DESTROYED','#ffd23f','');pl.forEach(q=>{if(q.t==t&&!q.alive)q.out=true});chk()}
function chk(){teams.forEach(t=>{if(t.alive&&!(t.bed.alive||pl.some(p=>p.t==t&&p.alive))){t.alive=false;log(t.nm+' team eliminated!')}});const al=teams.filter(t=>t.alive);if(al.length<=1&&!over)over={w:al[0]||null}}
function breakTile(p,tx,ty){const i=I(tx,ty);if(i<0)return false;
 for(const t of teams)if(t!=p.t&&t.bed.alive&&t.bed.tx==tx&&t.bed.ty==ty){destroyBed(t,p);return true}
 if(own[i]&&(g[i]==2||g[i]==4)){if(p.hum)snd('brk');burst((tx+.5)*T,(ty+.5)*T,BC[bty[i]]||COL[own[i]-1],4);bh[i]-=1+(p.pk||0)*.8;if(bh[i]<=0){g[i]=g[i]==2?1:0;own[i]=0;bty[i]=0}return true}return false}
function hurt(q,p){if(me&&dist(q,me)<520)snd('hit');const dm=(4+p.sw*1.5+(p.t.sharp?2:0))*(1-[0,.15,.28,.4][q.ar]-q.t.prot*.04);q.hp-=dm;const a=Math.atan2(q.y-p.y,q.x-p.x);q.kx=Math.cos(a)*260;q.ky=Math.sin(a)*260;q.lh={p,t:time};if(q.hp<=0)die(q,'was slain by '+lbl(p))}
function die(p,why){if(!p.alive)return;p.alive=false;p.fall=0;const k=p.lh&&time-p.lh.t<6?p.lh.p:null;if(p.hum){hurtFx=1;shake=14;snd('no')}if(k){k.kills=(k.kills||0)+1;if(k.hum){ST.k++;snd('kill');banner('KILL!','#ffd23f',lbl(p))}}
